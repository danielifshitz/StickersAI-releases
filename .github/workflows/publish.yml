name: Publish verified StickersAI release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable desktop version, for example 0.4.0'
        required: true
        type: string
      source_run_id:
        description: 'Successful two-target self-hosted v-tag Desktop packages run ID'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: stickersai-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: stickersai-updates
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=44,<48'
      - name: Refuse replacement of existing public versions
        env:
          GH_TOKEN: ${{ github.token }}
          STICKERSAI_RELEASE_VERSION: ${{ inputs.version }}
        run: python release-tools/check_public_version.py
      - name: Fetch verified private release assets and approved notes
        env:
          GH_TOKEN: ${{ secrets.STICKERSAI_SOURCE_ARTIFACTS_TOKEN }}
          STICKERSAI_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          STICKERSAI_RELEASE_VERSION: ${{ inputs.version }}
        run: python release-tools/download_artifacts.py
      - name: Verify inventories and sign update manifest
        env:
          STICKERSAI_UPDATE_PRIVATE_KEY: ${{ secrets.STICKERSAI_UPDATE_PRIVATE_KEY }}
          STICKERSAI_RELEASE_VERSION: ${{ inputs.version }}
        run: python release-tools/update_release.py sign --folder artifacts --destination release-assets --provenance release-provenance.json
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            release-assets/*
            release-provenance.json
          body_path: release-notes.md

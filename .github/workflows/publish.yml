name: Publish verified StickersAI release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable desktop version, for example 0.4.0'
        required: true
        type: string
      source_run_id:
        description: 'Successful v-tag Desktop packages run ID in the private source repository'
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: stickersai-updates
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=44,<48'
      - name: Fetch tested native artifacts
        env:
          GH_TOKEN: ${{ secrets.STICKERSAI_SOURCE_ARTIFACTS_TOKEN }}
          STICKERSAI_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          STICKERSAI_RELEASE_VERSION: ${{ inputs.version }}
        run: python release-tools/download_artifacts.py
      - name: Verify inventories and sign update manifest
        env:
          STICKERSAI_UPDATE_PRIVATE_KEY: ${{ secrets.STICKERSAI_UPDATE_PRIVATE_KEY }}
          STICKERSAI_RELEASE_VERSION: ${{ inputs.version }}
        run: python release-tools/update_release.py sign --folder artifacts --destination release-assets
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: true
          files: release-assets/*
          body: 'StickersAI installers and verified updates. Publish after clean-machine acceptance on every target. OS publisher signing is optional; security prompts may remain.'
